[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshine/hashpinner"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
# Error handling
thiserror = "2"

# YAML, parsed as an event stream so edits can be spliced by byte span
saphyr-parser = "0.0.11"

# Serialization, for --format json
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Colors
owo-colors = "4"

# CLI
clap = { version = "4", features = ["derive"] }

# Dev dependencies
insta = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
