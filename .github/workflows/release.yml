name: Release

on:
  push:
    tags:
      - 'v*'

# The action downloads these artifacts and verifies their checksums, so this
# workflow has to run before any tag can be referenced by `uses:`.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, 2026-07-16

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35, 2026-06-17
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2, 2026-01-30
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # Gate the release on the same checks CI runs, so a tag can never publish
      # something that would have failed on main.
      - name: Build, test and lint
        run: nix develop -c just ci

      # `just dist` asserts the tag matches the version cargo would publish.
      - name: Build static musl artifacts
        run: nix develop -c just dist "${GITHUB_REF_NAME}"

      # A smoke test on the artifact that will actually be shipped, not on a
      # host-native build that might differ.
      - name: Smoke-test the x86_64 binary
        run: |
          tar -xzf "dist/hashpinner-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" -C /tmp
          /tmp/hashpinner --version
          /tmp/hashpinner --check --no-allow .github/workflows

      # Packaging separately puts any manifest or include/exclude mistake before
      # the publish, which cannot be undone.
      - name: Package the crate
        run: nix develop -c cargo package --locked -p hashpinner

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: nix develop -c cargo publish --locked -p hashpinner

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2, 2026-07-13
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
